# Bootstrap session logs
#
# Applies infra/session-logs.cfn.yml, the write-only drop box for Claude Code
# session transcripts (plugins/session-logs/README.md § The drop box), with its writer secrets taken
# from GitHub, one secret per writer, scoped to the `bootstrap` environment so
# only jobs running there, behind its required reviewer, can read them:
#
#   SESSION_LOG_WRITER_<NAME>   e.g. SESSION_LOG_WRITER_LAPTOP, SESSION_LOG_WRITER_CLOUD
#
# The stack's WriterSecrets parameter is a NoEcho list that an apply can only
# replace whole, so managing it by hand means retyping every secret on every
# change. This workflow derives the list from the secrets
# instead: add a writer by adding one secret, rotate by overwriting it, remove
# by deleting it, then dispatch this. The value of each secret is the same
# string that writer's SESSION_LOG_SECRET is set to.
#
# Also read from the `bootstrap` environment (or the repo):
#
#   AWS_DEPLOY_ROLE_ARN         secret: the role infra/deploy-role.cfn.yml
#                               creates. Unset (a fresh fork), the job stops
#                               with a notice.
#   SESSION_LOGS_READER_ARNS    secret, optional: comma-separated ARNs of the
#                               IAM roles that may read the bucket and write
#                               under digests/. Unset, the stack grants no
#                               reader; delete it and dispatch to remove them.
#   SESSION_LOGS_STACK          variable: the stack name, default session-logs
#   SESSION_LOGS_BUCKET_PREFIX  variable: the bucket prefix, default session-logs
#   AWS_REGION                  variable: the region writers PUT to, default us-east-1
#
# Secret handling in the deploy step, pinned by test/session-logs-workflow.test.ts:
# the secrets context is read once into one step's env, filtered by prefix, and
# the joined value goes straight into the deploy command. It is never written
# to a step output (Actions drops outputs that carry a secret), never to the
# job env, never echoed; each value is validated as a bare hex token first so
# a stray comma or quote cannot corrupt the parameter or the bucket policy.
# The readers come out of the same JSON in the same step, each validated as an
# IAM role ARN and masked.
#
# The account id: this repo is public, so anyone can read a run's log, and
# Actions masks only secrets there. The bucket is <prefix>-<account id>, so
# the credentials step masks the id and it shows as *** wherever a later step
# prints it. The owner reads the real drop URL from the stack's DropUrl
# output, with credentials in the account.

name: Bootstrap session logs

on:
  workflow_dispatch:

jobs:
  apply:
    name: Apply the session-logs stack
    runs-on: ubuntu-latest
    environment: bootstrap
    permissions:
      id-token: write
      contents: read
    env:
      STACK: ${{ vars.SESSION_LOGS_STACK || 'session-logs' }}
      PREFIX: ${{ vars.SESSION_LOGS_BUCKET_PREFIX || 'session-logs' }}

    steps:
      - name: Check the deploy role is configured
        id: role
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::notice::AWS_DEPLOY_ROLE_ARN is not set on the bootstrap environment: nothing to deploy. Create the role from infra/deploy-role.cfn.yml and set its ARN (plugins/session-logs/README.md § Deploying the stack)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.role.outputs.ready == 'true'

      - name: Configure AWS credentials via OIDC
        if: steps.role.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          # Registers the account id as a secret for the rest of the job. The
          # action does so only where it exports the credentials to the
          # environment, its default: adding aws-profile here, or
          # output-env-credentials: false, would leave the id unmasked.
          mask-aws-account-id: true

      # A stack in UPDATE_ROLLBACK_FAILED cannot be updated, so without this
      # every later dispatch fails and clearing it needs admin credentials.
      # No-op otherwise.
      - name: Continue a stalled rollback, if the stack is in one
        if: steps.role.outputs.ready == 'true'
        run: node scripts/cfn-continue-stalled-rollback.mjs "$STACK"

      - name: Deploy the stack from SESSION_LOG_WRITER_* secrets
        if: steps.role.outputs.ready == 'true'
        env:
          # Every repository/environment secret, as JSON. Confined to this one
          # step; Actions masks each value in the log.
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          PREFIX_SECRETS='SESSION_LOG_WRITER_'

          # The writer entries, filtered once; everything below derives from them.
          WRITERS=$(jq -c --arg p "$PREFIX_SECRETS" '[to_entries[] | select(.key | startswith($p))] | sort_by(.key)' <<<"$SECRETS_JSON")
          NAMES=$(jq -r --arg p "$PREFIX_SECRETS" 'map(.key | ltrimstr($p)) | join(", ")' <<<"$WRITERS")
          COUNT=$(jq 'length' <<<"$WRITERS")
          if [ "$COUNT" = "0" ]; then
            echo "::error::No ${PREFIX_SECRETS}* secrets are set; refusing to deploy an empty writer list." >&2
            exit 1
          fi

          # Each value must be a bare hex token (openssl rand -hex 24 or longer):
          # the parameter is a comma list and the policy condition matches the
          # header verbatim, so anything else would corrupt one or the other.
          # \A…\z rather than ^…$: jq's regex engine lets `$` match before a
          # trailing newline, and a value pasted from `openssl … | pbcopy`
          # carries one: it would ride into the parameter and that writer's
          # Referer would never match.
          BAD=$(jq -r 'map(select(.value | test("\\A[0-9a-f]{32,}\\z") | not) | .key) | join(", ")' <<<"$WRITERS")
          if [ -n "$BAD" ]; then
            echo "::error::These writer secrets are not bare hex tokens of 32+ chars: ${BAD}" >&2
            exit 1
          fi

          WRITER_SECRETS=$(jq -r 'map(.value) | join(",")' <<<"$WRITERS")
          echo "::add-mask::${WRITER_SECRETS}"

          # The readers, optional: SESSION_LOGS_READER_ARNS, a comma-separated
          # list of IAM role ARNs. Each entry must be exactly a role ARN,
          # because the list becomes the Principal of an Allow in the bucket
          # policy: a `*` there would make every transcript public. \A…\z and
          # no trimming, as for the writers: a space or a newline stops the
          # run here, with an error that names the secret.
          READERS=$(jq -c '(.SESSION_LOGS_READER_ARNS // "") | if . == "" then [] else split(",") end' <<<"$SECRETS_JSON")
          BAD_READERS=$(jq 'map(select(test("\\Aarn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=.@_/-]+\\z") | not)) | length' <<<"$READERS")
          if [ "$BAD_READERS" != "0" ]; then
            echo "::error::SESSION_LOGS_READER_ARNS must be a comma-separated list of IAM role ARNs (arn:aws:iam::<account id>:role/<name>) with no spaces or newlines; ${BAD_READERS} of its entries are not." >&2
            exit 1
          fi
          READER_ARNS=$(jq -r 'join(",")' <<<"$READERS")
          # Actions already masks the secret as a whole. Each ARN is masked
          # too, so one printed alone (a CloudFormation event, say) is hidden.
          jq -r '.[] | "::add-mask::\(.)"' <<<"$READERS"

          echo "Deploying ${COUNT} writer(s): ${NAMES}"
          echo "Deploying $(jq 'length' <<<"$READERS") reader(s)"

          # ReaderRoleArns goes on every apply, empty included: deploy keeps
          # the previous value of a parameter it is not given, so leaving it
          # off would keep the readers of a secret that was deleted.
          aws cloudformation deploy \
            --stack-name "$STACK" \
            --template-file infra/session-logs.cfn.yml \
            --no-fail-on-empty-changeset \
            --parameter-overrides "WriterSecrets=${WRITER_SECRETS}" "BucketPrefix=${PREFIX}" "ReaderRoleArns=${READER_ARNS}"

      # The bucket name in the URL ends in the account id, which the
      # credentials step masked: the log shows
      # https://<prefix>-***.s3.<region>.amazonaws.com/drop. Writers need the
      # real URL, which the owner reads from the stack's DropUrl output with
      # credentials in the account.
      - name: 'Show the drop URL, with the account id masked as ***'
        if: steps.role.outputs.ready == 'true'
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='DropUrl'].OutputValue" \
            --output text
          echo "The account id in the bucket name shows as *** in this log, which anyone can read. Read the real URL from the ${STACK} stack's DropUrl output, with credentials in the account."
